<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="/manifest.webmanifest"><title>XTrend Signals</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:white;font-family:-apple-system,BlinkMacSystemFont,Arial}main{max-width:600px;margin:auto;padding:16px}.card{background:#151f32;border:1px solid #263247;border-radius:18px;padding:15px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:14px;border:0;border-radius:12px;background:#26344d;color:white;font-size:16px}.buy{color:#4ade80}.sell{color:#fb7185}.muted{color:#94a3b8;font-size:12px}.badge{background:#334155;padding:5px 8px;border-radius:8px;font-size:11px}a{color:#93c5fd}</style></head><body><main><div class="row"><h2>⚡ XTrend Signal Bot</h2><span id="st">⚪</span></div><div class="card"><div class="grid"><button onclick="load()">↻ Refresh</button><button onclick="notif()">🔔 Notifications</button></div><p class="muted">Official XTrend Speed signals • AUTO TRADE OFF</p></div><div id="list"></div><div class="card"><a href="https://www.xtrendspeed.com/en-US/signal" target="_blank">Open official XTrend Speed signals</a></div></main><script>let old={};async function load(){try{let d=await(await fetch("/api/signals")).json();if(!d.ok)throw 0;list.innerHTML=d.signals.map(x=>`<div class="card"><div class="row"><b>${x.symbol}</b><span class="badge">${x.strength}</span></div><div class="row" style="margin-top:12px"><b class="${x.direction=="BUY"?"buy":"sell"}">${x.direction}</b><span class="muted">${x.update_time}</span></div></div>`).join("")||"<div class=card>No signals parsed.</div>";for(let x of d.signals){let k=x.symbol+x.direction+x.update_time;if(!old[k]&&Notification.permission=="granted")new Notification("XTrend "+x.direction,{body:x.symbol+" • "+x.strength});old[k]=1}st.textContent="🟢"}catch(e){st.textContent="🔴";list.innerHTML="<div class=card>Live source unavailable. Open the official page.</div>"}}async function notif(){if("Notification"in window)await Notification.requestPermission()}if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");setInterval(load,30000);load();</script></body></html>
